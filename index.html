<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Robot Retarget Online — browser-based humanoid motion retargeting (GMR) with BVH preview / 在线人形机器人动作重定向"
    />
    <title>Robot Retarget Online | 在线机器人动作重定向</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%94%84%3C/text%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          // Keep these in sync with the theme backgrounds in src/composables/useAppTheme.ts
          var theme = localStorage.getItem('rro-theme') === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.background = theme === 'light' ? '#f7f6f3' : '#191919';
        } catch (e) {}
      })();
    </script>
    <script>
      // Touch diagnostics, armed before any bundle runs so nothing escapes it.
      // Inert unless the URL contains `touchdebug`; see src/lib/touchDebug.ts.
      (function () {
        if (!location.href.includes('touchdebug')) return;
        var probe = (window.__touchProbe = { prevented: [], listeners: [] });
        var TOUCHY = /^(touch|pointer|mouse|click)/;
        var frames = function (skip) {
          return ((new Error().stack || '').split('\n').slice(skip, skip + 3).join(' | ') || '?')
            .replace(/https?:\/\/[^/]+/g, '')
            .slice(0, 220);
        };
        var origPreventDefault = Event.prototype.preventDefault;
        Event.prototype.preventDefault = function () {
          if (TOUCHY.test(this.type)) {
            probe.prevented.push({ type: this.type, stack: frames(2) });
            if (probe.prevented.length > 60) probe.prevented.shift();
          }
          return origPreventDefault.apply(this, arguments);
        };
        var origAdd = EventTarget.prototype.addEventListener;
        EventTarget.prototype.addEventListener = function (type, fn, opts) {
          var global = this === window || this === document || this === document.body;
          if (global && TOUCHY.test(type)) {
            probe.listeners.push({
              type: type,
              on: this === window ? 'window' : this === document ? 'document' : 'body',
              capture: opts === true || !!(opts && opts.capture),
              passive: !!(opts && opts.passive),
              stack: frames(2),
            });
          }
          return origAdd.apply(this, arguments);
        };
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #191919;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
